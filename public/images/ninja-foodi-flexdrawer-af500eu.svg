<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f1f5f9"/>
  <!-- Airfryer Body -->
  <rect x="250" y="100" width="300" height="380" rx="40" fill="#1e293b"/>
  <!-- Top Panel -->
  <rect x="280" y="140" width="240" height="80" rx="10" fill="#0f172a"/>
  <!-- Display lights -->
  <circle cx="330" cy="180" r="10" fill="#38bdf8"/>
  <circle cx="370" cy="180" r="10" fill="#38bdf8"/>
  <rect x="410" y="170" width="80" height="20" rx="5" fill="#22c55e"/>
  <!-- Handle -->
  <rect x="375" y="280" width="50" height="120" rx="25" fill="#64748b"/>
  <!-- Drawer Divider line -->
  <line x1="250" y1="260" x2="550" y2="260" stroke="#0f172a" stroke-width="6"/>
  <line x1="400" y1="260" x2="400" y2="480" stroke="#0f172a" stroke-width="4"/>
  <!-- Text -->
  <text x="400" y="530" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#475569">Ninja Foodi FlexDrawer</text>
</svg>
